name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WEBAPP_NAME: copilot-roesli
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write   # required for OIDC federated auth to Azure
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend build
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - name: Backend publish
        working-directory: src/backend/CopilotMedallion.Api
        run: dotnet publish -c Release -o ../publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path src/backend/publish/* -DestinationPath app.zip -Force

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: app.zip

      - name: Azure logout
        if: always()
        run: az logout
